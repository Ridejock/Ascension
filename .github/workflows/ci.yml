# Builds, tests and packages Ascension on every push to main and on pull
# requests, by calling Emerald's reusable game workflow. tools/ci is checked
# out from Emerald; this repo does not copy those scripts.
#
# itch.io inputs are left unset on purpose. An empty itch user skips publishing
# and leaves the run green (docs/releasing.md). A tag still builds the archives.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The caller's group. game.yml uses emerald-game-${{ github.workflow }}-${{ github.ref }}
# so this does not deadlock with the called workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    uses: Ridejock/Emerald/.github/workflows/game.yml@main
    with:
      presets: debug,release
      platforms: windows,linux
      package-preset: release
      cmake-target: package
    secrets:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
